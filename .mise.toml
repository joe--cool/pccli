[tools]
go = "1.27.3"
"ubi:golangci/golangci-lint" = "2.15.0"
"ubi:goreleaser/goreleaser" = "2.19.0"
"ubi:charmbracelet/vhs" = "0.12.1"

[tasks.test]
description = "Run all Go tests"
run = "go test ./..."

[tasks.banner]
description = "Sync the banner into the embedded CLI asset"
run = "cp scripts/banner.ansi internal/cli/banner.ansi"

[tasks.build]
description = "Build the pccli binary"
run = "cp scripts/banner.ansi internal/cli/banner.ansi && go build -o bin/pccli ./cmd/pccli"

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks.demo]
description = "Run the CLI with mock data"
env = { PCCLI_MOCK = "true" }
run = "go run ./cmd/pccli services songs list"

[tasks.vhs]
description = "Build pccli and record the documentation videos"
run = "sh scripts/record-demos.sh"
